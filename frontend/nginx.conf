# Careflow frontend nginx configuration
server {

    # STEP 1: nginx can send the frontend files to the browser
    listen 80; # Listen on port 80 for HTTP requests
    root /usr/share/nginx/html; # Set the root directory for serving files -> where docker copy the dist directory from the build stage
    index index.html; # Set the default index file to serve when a directory is requested

    # STEP 2: nginx can proxy API requests to the backend
    location /api/ {
        # For all addresses starting with /api/, proxy the request to the backend service running on port 3000
        proxy_pass http://backend:3000; 

        # Additional info about the IP address of the client making the request, which can be useful for logging or security purposes
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        # For all other requests, serve the frontend files
        try_files $uri /index.html; # If the requested file doesn't exist, serve index.html 
    }

}
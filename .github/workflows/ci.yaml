name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
# Run tests on the backend
  test:
    runs-on: ubuntu-latest

    # Use a PostgreSQL service for the backend tests
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow_ci_password
          POSTGRES_DB: careflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    # Set environment variables for the backend tests (Replace the .env file with actual values)
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: careflow
      DB_PASSWORD: careflow_ci_password
      DB_NAME: careflow


    defaults:
      run:
        working-directory: backend

    # Run the backend tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test


  # Build and push Docker images to Amazon ECR
  build:
    needs: test
    # Bc serveur EC2 is ARM-based, we need to build the Docker images for ARM architecture
    runs-on: ubuntu-24.04-arm
    # Has the write permission for id-token to allow OIDC authentication and read permission for contents to allow reading the repository contents
    permissions:
      id-token: write
      contents: read
    
    
    steps:
      - uses: actions/checkout@v5

      # Build Docker images for the backend and frontend
      - name: Build images
        run: |
         docker build -t careflow-backend:${{ github.sha }} ./backend
         docker build -t careflow-frontend:${{ github.sha }} ./frontend
      
      # Exchange the GitHub OIDC token for AWS credentials and configure the AWS CLI to use those credentials
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role created in AWS IAM with permissions to push Docker images to ECR and deploy to EC2 via Systems Manager
          role-to-assume: arn:aws:iam::236554611831:role/careflow-github-deploy
          aws-region: eu-west-3

      # Log in to Amazon ECR 
      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Push the Docker images to Amazon ECR
      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          IMAGE_BACKEND=${{ steps.ecr.outputs.registry }}/careflow-backend:${{ github.sha }}
          docker tag careflow-backend:${{ github.sha }} $IMAGE_BACKEND
          docker push $IMAGE_BACKEND

          IMAGE_FRONTEND=${{ steps.ecr.outputs.registry }}/careflow-frontend:${{ github.sha }}
          docker tag careflow-frontend:${{ github.sha }} $IMAGE_FRONTEND
          docker push $IMAGE_FRONTEND


  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:

      # Reuse the AWS credentials configured in the build job to deploy to EC2 via Systems Manager
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236554611831:role/careflow-github-deploy
          aws-region: eu-west-3

      
      - name: Deploy to EC2 via Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }} # Find the EC2 instance ID in the GitHub repository settings under "Variables"
          IMAGE_TAG: ${{ github.sha }} # Use the GitHub SHA (commit hash) as the image tag to deploy the specific version of the Docker images built in the previous step
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters "commands=[\"sudo -u ssm-user git -C /home/ssm-user/CareFlow pull\",\"IMAGE_TAG=$IMAGE_TAG /home/ssm-user/CareFlow/scripts/deploy.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status: Status, Output: StandardOutputContent, Errors: StandardErrorContent}" --output json

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          test "$STATUS" = "Success"

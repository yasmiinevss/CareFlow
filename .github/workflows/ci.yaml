name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow_ci_password
          POSTGRES_DB: careflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: careflow
      DB_PASSWORD: careflow_ci_password
      DB_NAME: careflow

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test


  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build image
        run: |
         docker build -t careflow-backend:${{ github.sha }} ./backend
         docker build -t careflow-frontend:${{ github.sha }} ./frontend
      
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236554611831:role/careflow-github-deploy
          aws-region: eu-west-3

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          IMAGE-BACKEND=${{ steps.ecr.outputs.registry }}/careflow-backend:${{ github.sha }}
          docker tag careflow-backend:${{ github.sha }} $IMAGE-BACKEND
          docker push $IMAGE-BACKEND
          
          IMAGE-FRONTEND=${{ steps.ecr.outputs.registry }}/careflow-frontend:${{ github.sha }}
          docker tag careflow-frontend:${{ github.sha }} $IMAGE-FRONTEND
          docker push $IMAGE-FRONTEND

 

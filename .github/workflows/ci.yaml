name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: careflow
          POSTGRES_PASSWORD: careflow_ci_password
          POSTGRES_DB: careflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U careflow -d careflow"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: careflow
      DB_PASSWORD: careflow_ci_password
      DB_NAME: careflow

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test


  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: |
         docker build -t careflow-backend:${{ github.sha }} ./backend
         docker build -t careflow-frontend:${{ github.sha }} ./frontend
      
      - name: Configure AWS credentials (OIDC)
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236554611831:role/careflow-github-deploy
          aws-region: eu-west-3

      - name: Log in to Amazon ECR
        if: github.event_name == 'push'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push image to ECR
        if: github.event_name == 'push'
        run: |
          IMAGE_BACKEND=${{ steps.ecr.outputs.registry }}/careflow-backend:${{ github.sha }}
          docker tag careflow-backend:${{ github.sha }} $IMAGE_BACKEND
          docker push $IMAGE_BACKEND

          IMAGE_FRONTEND=${{ steps.ecr.outputs.registry }}/careflow-frontend:${{ github.sha }}
          docker tag careflow-frontend:${{ github.sha }} $IMAGE_FRONTEND
          docker push $IMAGE_FRONTEND

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::236554611831:role/careflow-github-deploy
          aws-region: eu-west-3

      - name: Deploy to EC2 via Systems Manager
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy $IMAGE_TAG" \
            --parameters "commands=[\"sudo -u ssm-user git -C /home/ssm-user/CareFlow pull\",\"IMAGE_TAG=$IMAGE_TAG /home/ssm-user/CareFlow/scripts/deploy.sh\"]" \
            --query "Command.CommandId" --output text)
          echo "Command ID: $COMMAND_ID"

          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" || true

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status: Status, Output: StandardOutputContent, Errors: StandardErrorContent}" --output json

          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query Status --output text)
          test "$STATUS" = "Success"

  backend:
    image: 236554611831.dkr.ecr.eu-west-3.amazonaws.com/careflow-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports: !reset []
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-3
        awslogs-group: /careflow
        awslogs-stream: backend

  frontend:
    image: 236554611831.dkr.ecr.eu-west-3.amazonaws.com/careflow-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    ports: !override
      - "80:80"
    restart: unless-stopped
    logging:
      driver: awslogs
      options:
        awslogs-region: eu-west-3
        awslogs-group: /careflow
        awslogs-stream: frontend